name: Weekly developments

on:
  schedule:
    # Mondays at 12:00 UTC (8am US Eastern during daylight time)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-developments
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Research and write this week's developments
        run: node scripts/weekly-developments.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check the site still builds
        run: npm run build

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain src/data/developments)" ]; then
            echo "No new developments to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/developments
          git commit -m "Add weekly developments for $(date -u +%Y-%m-%d)"
          git push
